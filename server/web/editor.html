<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Edit spreadsheet — WPS</title>
<link rel="icon" href="/static/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/editor.js" defer></script>
</head>
<body class="editor-body">
<div id="editor-top">
  <img class="logo" src="/static/favicon.png" alt="">
  <span id="editor-title">Loading…</span>
  <span class="grow"></span>
  <span id="editor-status" class="muted small"></span>
  <a href="/" id="editor-close" class="btn small">Close</a>
</div>
<div id="editor-hint" class="muted small">Changes save automatically. If this file is open on the PC, your edits are kept and written to it as soon as it's closed there.</div>
<div id="ph"></div>
<div id="editor-error" class="editor-error" hidden></div>
</body>
</html>
