# Remote Files — extra server block for the existing Clever Campus nginx.
# An exact server_name beats the *.clevercampus.cloud wildcard, so tenants are unaffected.
# The existing wildcard certificate (*.clevercampus.cloud) already covers this name.

server {
    listen 80;
    server_name files.clevercampus.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name files.clevercampus.cloud;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 10m;

    # Resolve the upstream at request time via Docker's DNS. With a plain
    # proxy_pass hostname, nginx would refuse to START if remote-files-server
    # were down — taking Clever Campus down with it.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $remote_files_upstream http://remote-files-server:8080;

    location / {
        proxy_pass $remote_files_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Agents long-poll for ~25s; give headroom.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
}

# ---- OnlyOffice Document Server (in-browser Excel editing) ----
# Remove this block (and the onlyoffice service in compose) to ship without Excel.
map $http_upgrade $connection_upgrade_office {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name office.clevercampus.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name office.clevercampus.cloud;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 100m; # spreadsheets can be large

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $office_upstream http://onlyoffice;

    location / {
        proxy_pass $office_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (OnlyOffice co-editing channel).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade_office;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
